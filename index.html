<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Download the latest version of Dantotsu, an open-source anime streaming app. An independent community project." />
    <meta name="theme-color" content="#05070a" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com ws: wss:; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;" />
    <meta property="og:title" content="Dantotsu Updater - Latest Version" />
    <meta property="og:description" content="Download the latest Dantotsu release, view changelogs, and find official community links." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:site_name" content="Dantotsu Updater" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Dantotsu Updater - Download the Latest Version</title>
    <style>
      #boot-error {
        display: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #05070a;
        color: #ff6b6b;
        padding: 2rem;
        min-height: 100vh;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot-error h1 {
        color: #f0f2f5;
        margin-top: 0;
      }
    </style>
    <script>
      (function () {
        var el = document.getElementById('boot-error')
        function showError(msg) {
          if (!el) return
          el.style.display = 'block'
          el.textContent = (el.textContent ? el.textContent + '\n' : '') + msg
        }
        window.addEventListener('error', function (e) {
          showError('Runtime error: ' + e.message + ' (' + (e.filename || '') + ':' + (e.lineno || 0) + ')')
        })
        window.addEventListener('unhandledrejection', function (e) {
          showError('Unhandled promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)))
        })
        window.__showBootError = showError
      })()
    </script>
  </head>
  <body>
    <noscript>
      <style>
        #root { display: none !important; }
        .noscript { font-family: system-ui, sans-serif; background: #05070a; color: #f0f2f5; padding: 2rem; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .noscript h1 { color: #4f8ef7; }
        .noscript h1 { color: #4f8ef7; }
      </style>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>Dantotsu Updater needs JavaScript to fetch the latest release data and verify your browser. Please enable JavaScript to continue.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <div id="boot-error" aria-live="assertive">
      <h1>Something went wrong</h1>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
